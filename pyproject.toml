[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "review-processes"
version = "0.1.0"
description = "Approval-gated business review automations"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.29,<3",
  "google-auth-oauthlib>=1.2,<2",
  "pypdf>=4.2,<6",
  "requests>=2.31,<3",
]

[project.scripts]
vendor-review = "review_processes.vendor_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
