name: Monthly Vendor Audit

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Recent evidence window in days"
        required: false
        default: "180"
      history_days:
        description: "Historical evidence window in days"
        required: false
        default: "730"
  schedule:
    # GitHub cron is UTC. These are the two Central-time 8:00 AM candidates;
    # the guard below skips whichever candidate is not 8 AM locally.
    - cron: "0 13 1 * *"
    - cron: "0 14 1 * *"

permissions:
  contents: read

concurrency:
  group: monthly-vendor-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AIRTABLE_BASE_ID: app25k6lMy8bzOhq5
      AIRTABLE_VENDOR_TABLE: tblmysPS8GSncnWSa
      AIRTABLE_VENDOR_VIEW: viwVD8IFpH6fXUPvh
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '180' }}
      HISTORY_DAYS: ${{ github.event.inputs.history_days || '730' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the vendor-review command
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Guard the trusted branch and Central-time schedule
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Vendor Audit may run only from main; refusing unreviewed branch secrets."
            exit 1
          fi
          run="true"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            central_hour="$(TZ=America/Chicago date +%H)"
            if [[ "$central_hour" != "08" ]]; then
              echo "Central time is ${central_hour}:00; this is the other DST candidate, so skipping."
              run="false"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        if: steps.guard.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Check required runtime inputs
        if: steps.guard.outputs.run == 'true'
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RECIPIENT_USER_ID: ${{ vars.SLACK_RECIPIENT_USER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$AIRTABLE_API_KEY" ]] || missing+=(AIRTABLE_API_KEY)
          [[ -n "$GOOGLE_TOKEN_JSON" ]] || missing+=(GOOGLE_TOKEN_JSON)
          [[ -n "$SLACK_BOT_TOKEN" ]] || missing+=(SLACK_BOT_TOKEN)
          [[ -n "$SLACK_RECIPIENT_USER_ID" ]] || missing+=(SLACK_RECIPIENT_USER_ID)
          [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]] || missing+=(LOOKBACK_DAYS)
          [[ "$HISTORY_DAYS" =~ ^[0-9]+$ ]] || missing+=(HISTORY_DAYS)
          if (( ${#missing[@]} )); then
            printf '::error::Missing or invalid runtime input(s): %s\n' "${missing[*]}"
            exit 1
          fi
          if (( LOOKBACK_DAYS < 1 || HISTORY_DAYS < LOOKBACK_DAYS )); then
            echo "::error::HISTORY_DAYS must be at least LOOKBACK_DAYS and both must be positive."
            exit 1
          fi

      - name: Materialize and validate the Gmail read-only token
        if: steps.guard.outputs.run == 'true'
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GOOGLE_TOKEN_JSON" > "$RUNNER_TEMP/vendor-google-token.json"
          python - "$RUNNER_TEMP/vendor-google-token.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())
          required = {"token", "refresh_token", "token_uri", "client_id", "client_secret"}
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit("Gmail token is missing required OAuth fields: " + ", ".join(missing))
          scopes = data.get("scopes")
          if not isinstance(scopes, list) or "https://www.googleapis.com/auth/gmail.readonly" not in scopes:
              raise SystemExit("Gmail token must carry the read-only Gmail scope")
          PY

      - name: Run the complete read-only vendor audit
        id: audit
        if: steps.guard.outputs.run == 'true'
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_TOKEN_FILE="$RUNNER_TEMP/vendor-google-token.json"
          export REVIEW_STATE_DIR="$RUNNER_TEMP/vendor-review-state"
          vendor-review audit \
            --lookback-days "$LOOKBACK_DAYS" \
            --history-days "$HISTORY_DAYS" \
            --json > "$RUNNER_TEMP/vendor-audit-report.json"
          test -s "$RUNNER_TEMP/vendor-audit-report.json"

      - name: Deliver the verified report to Slack
        id: report
        if: steps.guard.outputs.run == 'true' && steps.audit.outcome == 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RECIPIENT_USER_ID: ${{ vars.SLACK_RECIPIENT_USER_ID }}
        run: |
          set -euo pipefail
          python scripts/publish_vendor_audit.py \
            --report "$RUNNER_TEMP/vendor-audit-report.json" \
            --run-url "$RUN_URL"

      - name: Alert Slack if the audit did not complete
        if: failure() && steps.guard.outputs.run == 'true' && steps.report.outcome != 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RECIPIENT_USER_ID: ${{ vars.SLACK_RECIPIENT_USER_ID }}
        run: |
          set -euo pipefail
          python scripts/publish_vendor_audit.py \
            --failure "The scheduled audit did not complete. Please open the run for details." \
            --run-url "$RUN_URL"

      - name: Remove runtime credentials and report data
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/vendor-google-token.json" "$RUNNER_TEMP/vendor-audit-report.json"
